<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background subtle ambient glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Main Shield / Document Gradient -->
    <linearGradient id="bgGrad" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Inner Plate Gradient -->
    <linearGradient id="plateGrad" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Neon Accent Glow for Spark / Core -->
    <linearGradient id="coreGrad" x1="20" y1="16" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Document Fold Gradient -->
    <linearGradient id="foldGrad" x1="38" y1="10" x2="50" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle Base with Soft Shadow -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" />

  <!-- Inner Dark Glass Plate -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#plateGrad)" />

  <!-- Document Silhouette -->
  <!-- Main sheet with dog-ear corner -->
  <path d="M19 15C19 13.3431 20.3431 12 22 12H37L46 21V48C46 49.6569 44.6569 51 43 51H22C20.3431 51 19 49.6569 19 48V15Z" 
        fill="#1E293B" stroke="url(#bgGrad)" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Corner Dog-Ear Fold -->
  <path d="M37 12V19C37 20.1046 37.8954 21 39 21H46" 
        fill="url(#foldGrad)" stroke="url(#bgGrad)" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Resume Content Accent Lines -->
  <rect x="24" y="22" width="10" height="2.5" rx="1.25" fill="#64748B" />
  <rect x="24" y="27" width="16" height="2" rx="1" fill="#475569" />
  <rect x="24" y="31.5" width="13" height="2" rx="1" fill="#475569" />

  <!-- Glowing AI Sparkle / Forge Star Emblem -->
  <!-- 4-point Diamond Star with Radiant Center -->
  <g filter="url(#glow)">
    <!-- Central Beam Horizontal -->
    <path d="M32 35 C32 38.5 28.5 42 25 42 C28.5 42 32 45.5 32 49 C32 45.5 35.5 42 39 42 C35.5 42 32 38.5 32 35Z" 
          fill="url(#coreGrad)" />
    <!-- Secondary Small Star Sparkle -->
    <path d="M39 30 C39 31.8 37.2 33.5 35.5 33.5 C37.2 33.5 39 35.2 39 37 C39 35.2 40.8 33.5 42.5 33.5 C40.8 33.5 39 31.8 39 30Z" 
          fill="#38BDF8" opacity="0.9" />
  </g>

  <!-- Glowing Central Micro Node -->
  <circle cx="32" cy="42" r="1.5" fill="#FFFFFF" />
</svg>
